<!doctype html>
<html lang="pt-BR">

    <meta name="theme-color" content="#FBF8F3" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- SEO básico (o título e a descrição também são atualizados por página via componente <Seo/>) -->
